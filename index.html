<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carrossel CSS</title>

    <style>

        :root {
            --cor-principal: #800020;
            --cor-secundaria: #a52a4a;
            --cor-clara: #f8e8ec;
            --cor-escura: #4b0013;
            --cor-branca: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--cor-clara);
            color: var(--cor-escura);
        }

        header {
            background-color: var(--cor-principal);
            color: var(--cor-branca);
            text-align: center;
            padding: 30px;
        }

        main {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }


        /* ESCONDE OS BOTÕES DE RADIO */

        input[type="radio"] {
            display: none;
        }


        /* ÁREA VISÍVEL DO CARROSSEL */

        .carrossel {
            overflow: hidden;

            border: 5px solid var(--cor-principal);
            border-radius: 15px;
        }


        /* CONJUNTO DOS SLIDES */

        .slides {
            display: flex;

            width: 500%;

            transition: transform 0.5s ease;
        }


        /* CADA SLIDE */

        .slide {
            width: 20%;
            flex-shrink: 0;
        }


        .slide img {
            width: 100%;
            height: 450px;

            object-fit: cover;

            display: block;
        }


        .slide figcaption {
            background-color: var(--cor-principal);
            color: white;

            text-align: center;

            padding: 15px;
        }


        /* MOVIMENTAÇÃO DOS SLIDES */

        #slide1:checked ~ .carrossel .slides {
            transform: translateX(0);
        }

        #slide2:checked ~ .carrossel .slides {
            transform: translateX(-20%);
        }

        #slide3:checked ~ .carrossel .slides {
            transform: translateX(-40%);
        }

        #slide4:checked ~ .carrossel .slides {
            transform: translateX(-60%);
        }

        #slide5:checked ~ .carrossel .slides {
            transform: translateX(-80%);
        }


        /* BOTÕES */

        .botoes {
            display: flex;

            justify-content: center;

            gap: 10px;

            margin-top: 20px;
        }


        .botoes label {
            width: 20px;
            height: 20px;

            background-color: var(--cor-secundaria);

            border-radius: 50%;

            cursor: pointer;
        }


        .botoes label:hover {
            background-color: var(--cor-escura);
        }


        footer {
            background-color: var(--cor-escura);
            color: white;

            text-align: center;

            padding: 25px;

            margin-top: 40px;
        }


        /* CELULAR */

        @media (max-width: 700px) {

            .slide img {
                height: 280px;
            }

        }

    </style>
</head>


<body>

    <header>

        <h1>Compre seu curso</h1>

        <p>Seja um programador web </p>

    </header>


    <main>

        <h2>Conheça nossos cursos</h2>


        <!-- BOTÕES INVISÍVEIS -->

        <input type="radio" name="carrossel" id="slide1" checked>

        <input type="radio" name="carrossel" id="slide2">

        <input type="radio" name="carrossel" id="slide3">

        <input type="radio" name="carrossel" id="slide4">

        <input type="radio" name="carrossel" id="slide5">


        <!-- CARROSSEL -->

        <section class="carrossel">

            <div class="slides">


                <figure class="slide">

                    <img
                        src="https://storage.googleapis.com/star-lab/blog/OGs/fullstack.png"
                        alt="full stack"
                    >

                    <figcaption>
                        Programação full stack.
                    </figcaption>

                </figure>


                <figure class="slide">

                    <img
                        src="https://polijunior.com.br/wp-content/uploads/2024/07/python_hero_image.png"
                        alt="python"
                    >

                    <figcaption>
                        Programação python.
                    </figcaption>

                </figure>


                <figure class="slide">

                    <img
                        src="https://terminalroot.com.br/assets/img/cppdaily/alternative-cpp.jpg"
                        alt="C++"
                    >

                    <figcaption>
                        Programação C++.
                    </figcaption>

                </figure>


                <figure class="slide">

                    <img
                        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSDlFVr4dyyuUUs37Nc-9bHfSvdTp99Dhd4kFjvgQWNJZf0Hg5Uxq9ddkA8&s=10"
                        alt="Java"
                    >

                    <figcaption>
                        Programação Java.
                    </figcaption>

                </figure>


                <figure class="slide">

                    <img
                        src="https://programadoresdepre.com.br/storage/media/o-que-e-mysql-1772831832.jpg"
                        alt="MySQL"
                    >

                    <figcaption>
                        Programação MySQL.
                    </figcaption>

                </figure>

            </div>

        </section>


        <!-- BOTÕES VISÍVEIS -->

        <div class="botoes">

            <label for="slide1"></label>

            <label for="slide2"></label>

            <label for="slide3"></label>

            <label for="slide4"></label>

            <label for="slide5"></label>

        </div>

    </main>


    <footer>

        <p>Desenvolvido por João Raphael</p>

    </footer>

</body>

</html>
